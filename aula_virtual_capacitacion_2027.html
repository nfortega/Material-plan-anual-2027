<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula virtual · Plan Anual de Capacitación 2027 · CSB Directo</title>
<style>
:root{--navy:#102d50;--blue:#2571b9;--sky:#e9f3fc;--aqua:#d9ebfa;--muted:#59708a;--bg:#f3f7fb;--line:#dbe5f0;--white:#fff;--good:#22765f;--amber:#bd7924;--orange:#ff8916;--shadow:0 10px 30px rgba(15,46,78,.07)}
*{box-sizing:border-box}html{scroll-padding-top:130px}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--navy);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #92c6f0;outline-offset:2px}
h1{font-size:clamp(26px,3vw,34px);letter-spacing:-.8px;margin:6px 0 4px}h2{font-size:22px;margin:0 0 9px;letter-spacing:-.4px}h3{font-size:17px;margin:0 0 9px}
.sub{font-size:14px;color:var(--muted);line-height:1.65;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:var(--blue);font-size:11px}
/* barra superior */
.tb{position:sticky;top:0;z-index:50;height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 clamp(14px,2.2vw,32px);box-shadow:0 2px 14px rgba(16,45,80,.05)}
.tb-brand{display:flex;align-items:center;flex:none;height:100%;text-decoration:none}.tb-brand img{height:56px;width:auto;display:block}
.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;padding-left:6px}.tb-title b{font-size:15px}.tb-title small{color:var(--muted);font-size:12px}
.tb-actions{display:flex;gap:8px;align-items:center}
.tb-logo2{flex:none;display:flex;align-items:center}.tb-logo2 img{height:34px;width:auto;display:block}
.btn{border:1px solid #cdddeb;background:#fff;color:var(--navy);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.toggle[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
/* tira de meses */
.ms{position:sticky;top:72px;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:10px clamp(14px,2.2vw,32px);display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.ms::-webkit-scrollbar{display:none}
.ms-lbl{flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-right:6px}
.ms button{flex:none;border:1px solid transparent;background:transparent;color:#35516f;font-weight:700;font-size:13px;padding:8px 13px;border-radius:10px;display:inline-flex;align-items:center;gap:7px}
.ms button:hover{background:#eef4fa}.ms button.active{background:var(--navy);color:#fff}
.ms i{width:7px;height:7px;border-radius:50%;background:#c9d6e4;display:inline-block}.ms i.on{background:var(--orange)}.ms button.active i.on{background:#ffb35c}
.ms button.home{border-color:var(--line)}
/* layout */
.main{max-width:1320px;padding:28px clamp(18px,3vw,48px) 70px;margin:0 auto;width:100%}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(15,46,78,.06);padding:22px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mb{margin-bottom:20px}.mt{margin-top:20px}
.pill{display:inline-flex;align-items:center;background:#e7f0fa;color:#1d609c;padding:5px 10px;border-radius:30px;font-weight:700;font-size:11px;white-space:nowrap}
.pill.ok{background:#e1f3ec;color:var(--good)}.pill.warn{background:#fff3e6;color:#9a5a10}.pill.soon{background:#eef1f5;color:#5b6b7d}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.crumb button{border:0;background:none;padding:0;color:var(--blue);font:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:800}.crumb button:hover{text-decoration:underline}
/* hero */
.hero{background:linear-gradient(120deg,#0f3a68,#2779ba);border-radius:20px;padding:clamp(24px,3.4vw,42px);color:#fff;display:flex;gap:30px;justify-content:space-between;align-items:center;margin-bottom:22px;overflow:hidden}
.hero .hm-eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#c1e4ff}
.hero h1{margin:10px 0;font-size:clamp(26px,3.4vw,40px);letter-spacing:-1px;line-height:1.12;max-width:760px}
.hero p{margin:0 0 6px;color:#dcecfa;max-width:680px;line-height:1.65;font-size:15px}

.bar{height:6px;border-radius:6px;background:#e3edf8;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);border-radius:6px;transition:width .3s}
/* tarjetas de mes */
.mc{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mc:hover{transform:translateY(-2px);border-color:#9fbbd6}.mc .mn{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue)}
.mc b{font-size:16px;line-height:1.3}.mc small{color:var(--muted);line-height:1.45}.mc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}

.steps3 .st{display:flex;gap:14px;align-items:flex-start}.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.num.or{background:var(--orange)}
/* tarjeta de audiencia */
.aud{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.aud .who{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue)}
.aud h3{margin:0;font-size:18px;line-height:1.3}.aud p{margin:0;color:var(--muted);line-height:1.55}
.aud.soon{background:#f8fafc;box-shadow:none}.aud .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}

.course{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 14px;box-shadow:var(--shadow)}
.side h3{font-size:15px;margin:0 0 4px;padding:0 6px}.side .pg{padding:0 6px 12px;font-size:11.5px;color:var(--muted)}.side .pg .bar{margin-top:7px;height:4px}
.grp{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:12px 8px 5px}
.li{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--navy);padding:9px 8px;border-radius:11px}
.li:hover{background:#f1f6fb}.li.active{background:#e9f3fc;box-shadow:inset 3px 0 0 var(--orange)}
.li .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c9d6e4;display:grid;place-items:center;font-size:11px;font-weight:800;color:#4a6a8a;background:#fff}
.li.done .n{background:var(--good);border-color:var(--good);color:#fff}.li.active .n{border-color:var(--blue);color:var(--blue)}.li.done.active .n{color:#fff}
.li span{font-size:13px;font-weight:600;line-height:1.3}.li small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.lesson{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(20px,3vw,34px);min-width:0}
.lesson h2{padding-left:12px;border-left:4px solid var(--orange);font-size:25px;margin:6px 0 6px}
.lesson .lead{color:var(--muted);line-height:1.7;margin:0 0 18px;font-size:15px}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue)}
.cardb{border:1px solid var(--line);border-radius:14px;padding:18px;background:#f7fafd}
.cardb h3{display:flex;gap:10px;align-items:center}.cardb ul{margin:0;padding-left:18px;line-height:1.65;color:#27425f}.cardb li{margin-bottom:6px}
.big{background:linear-gradient(120deg,#0f3a68,#2779ba);color:#fff;border-radius:16px;padding:24px}.big .tag{font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:#ffc98c}
.big p{margin:10px 0 0;font-size:18px;line-height:1.55}.lightc{background:#eef5fc;border:1px solid #d6e5f4;border-radius:16px;padding:24px}.lightc .tag{font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--orange)}
.lightc p{margin:10px 0 0;font-size:18px;line-height:1.55}
.src{font-size:11.5px;color:var(--muted);margin-top:12px}
.callout{background:#fff4e2;color:#6d4306;border-radius:12px;padding:13px 16px;line-height:1.6;margin-top:16px}
.callout.blue{background:#e9f3fc;color:#1b4f7f}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.tl>div{background:#eef5fc;border-radius:14px;padding:14px}.tl b{display:block;font-size:20px;color:var(--orange);letter-spacing:-.5px}.tl small{color:var(--muted);font-size:11px}.tl strong{display:block;margin-top:8px}.tl span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
.vcard{border:1px solid var(--line);border-radius:14px;background:#f7fafd;padding:16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.vcard:hover{border-color:#9fbbd6}.vcard .vt{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px}.vcard .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px}
.vcard p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}.vcard .more{display:none;background:#fff3e6;border-radius:10px;padding:9px 11px;font-size:13px;color:#6d4306;margin-top:4px;line-height:1.5}
.vcard.open{background:#fff;border-color:#9fbbd6}.vcard.open .more{display:block}.vcard .hint{font-size:11px;color:var(--blue);font-weight:700}
.cycle{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}.cycle .s{text-align:center;padding:6px}
.cycle .s .num{margin:0 auto 10px;width:52px;height:52px;font-size:20px}.cycle .s b{display:block;font-size:15px}.cycle .s span{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
textarea{width:100%;border:1px solid #cdddeb;border-radius:12px;padding:12px;background:#fff;resize:vertical;min-height:76px;line-height:1.5}
label.f{display:block;font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.match{display:grid;gap:10px}.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.5fr);gap:12px;align-items:center}
.mrow .cn{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}.mrow .cn i{font-style:normal;background:var(--orange);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.mrow select{width:100%;border:2px solid #cdddeb;border-radius:12px;padding:11px;background:#fff;font-weight:800;text-align:center}
.mrow.ok select{border-color:var(--good);background:#e1f3ec}.mrow.bad select{border-color:#c0504d;background:#fdeceb}
.mrow .df{background:#eef5fc;border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:center;line-height:1.45}.mrow .df i{font-style:normal;background:var(--blue);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;font-weight:800}
.fb{font-size:13px;font-weight:700;margin-top:10px}.fb.ok{color:var(--good)}.fb.bad{color:#b03a37}
.case{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.case>button{width:100%;text-align:left;border:0;background:#f7fafd;padding:15px 18px;display:flex;gap:12px;align-items:center;font-weight:700;line-height:1.4}
.case .body{display:none;padding:16px 18px;border-top:1px solid var(--line)}.case.open .body{display:block}.case.open>button{background:#e9f3fc}
.case .ans{display:none;background:#e1f3ec;border-radius:12px;padding:12px 14px;margin-top:12px;color:#14563f;line-height:1.55}.case .ans.show{display:block}
.qs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}.qs span{background:#e7f0fa;color:#1d609c;border-radius:99px;padding:6px 12px;font-weight:700;font-size:12.5px}
.casc>div{border-radius:14px;padding:16px 20px;color:#fff;margin-bottom:10px}.casc small{display:block;font-weight:800;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.cm{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:stretch;margin-bottom:12px}.cm .k{border-radius:12px;color:#fff;font-weight:800;display:grid;place-items:center;padding:10px;font-size:16px}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}.q .qt{display:flex;gap:12px;align-items:flex-start;line-height:1.5;font-weight:600}
.q .opts{display:flex;gap:10px;margin-top:12px}.q .opts button{flex:1;max-width:160px;border:2px solid #cdddeb;background:#fff;border-radius:12px;padding:10px;font-weight:800}
.q .opts button:hover{border-color:#9fbbd6}.q .opts button.sel{border-color:var(--blue);background:#e9f3fc}
.q.ok{border-color:#9ad3bd;background:#f3fbf7}.q.bad{border-color:#e6a9a7;background:#fff7f6}
.q .ex{display:none;margin-top:10px;font-size:13px;line-height:1.5;color:#27425f}.q.ok .ex,.q.bad .ex{display:block}
.score{text-align:center;padding:26px;border-radius:16px;margin-top:10px}.score b{font-size:46px;letter-spacing:-1.5px;display:block}.score.pass{background:#e1f3ec;color:#14563f}.score.fail{background:#fff3e6;color:#7a4a05}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:26px;flex-wrap:wrap}
.done-btn{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.inst{display:none;background:#fff4e2;border:1px dashed #e8b56c;border-radius:12px;padding:14px 16px;margin-top:20px;color:#6d4306;line-height:1.6}
body.inst-on .inst{display:block}.inst b{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:4px}
.cert{background:linear-gradient(120deg,#0f3a68,#2779ba);color:#fff;border-radius:16px;padding:26px;text-align:center;margin-top:18px}.cert b{font-size:22px;display:block;margin-bottom:6px}
.empty{padding:26px;text-align:center;color:var(--muted)}
footer.foot{margin-top:34px;color:var(--muted);font-size:12px;text-align:center}
 .modal{position:fixed;inset:0;background:#0b1f3a99;z-index:100;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.mbox h2{margin:0 0 6px;font-size:21px}.mbox .sub{margin-bottom:14px}.mbox input,.mbox select{width:100%;border:1px solid #cdddeb;border-radius:12px;padding:12px;background:#fff}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.err{color:#b03a37;font-weight:700;font-size:13px;margin-top:10px;min-height:18px}
.me{display:inline-flex;gap:8px;align-items:center;border:1px solid #cdddeb;background:#f6f9fc;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;max-width:240px}.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.adm .tbl{overflow:auto;border:1px solid var(--line);border-radius:12px}.adm table{border-collapse:collapse;width:100%;font-size:13px}.adm th{background:#edf4fa;text-align:left;padding:10px 12px;white-space:nowrap}.adm td{padding:10px 12px;border-top:1px solid #edf2f8;white-space:nowrap}.adm tr:hover td{background:#f6fafe}
.adm .bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.adm select{border:1px solid #cdddeb;border-radius:10px;padding:9px 12px;background:#fff}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.tl,.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}}

 if(act==='val'){a.classList.toggle('open');const h=a.querySelector('.hint');h.textContent=a.classList.contains('open')?'Ocultar −':'Ver cómo se ve en mi puesto ＋'}
 if(act==='case'){a.closest('.case').classList.toggle('open')}
 if(act==='ans'){const s=a.closest('.body').querySelector('.ans');s.classList.toggle('show');a.textContent=s.classList.contains('show')?'Ocultar puntos de salida':'Ver puntos de salida'}
 if(act==='done'){const d=isDone(CUR.c,CUR.idx);setDone(CUR.c,CUR.idx,!d);course(CUR.c.id,CUR.idx);return}
 if(act==='mcheck'){const sel=[...document.querySelectorAll('select[data-m]')];S.match.a=sel.map(s=>s.value);save();let ok=0;sel.forEach((s,k)=>{const r=s.closest('.mrow');r.classList.remove('ok','bad');if(!s.value)return;if(s.value===MATCH_K[k]){r.classList.add('ok');ok++}else r.classList.add('bad')});
  const fb=$('#mfb');if(ok===5){fb.className='fb ok';fb.textContent='¡Perfecto! 5 de 5 correctas.';setDone(CUR.c,8)}else{fb.className='fb bad';fb.textContent=`${ok} de 5 correctas. Revisa las que están en rojo y vuelve a intentarlo.`}}
 if(act==='mreset'){S.match.a=[];save();course(CUR.c.id,CUR.idx)}
 if(act==='csave'){['comp0','comp1','comp2','cname','csup'].forEach(k=>{const el=document.querySelector('[data-txt="'+k+'"]');if(el)S.txt[k]=el.value});save();setDone(CUR.c,11);$('#cfb').className='fb ok';$('#cfb').textContent='Compromiso guardado en este navegador. Compártelo con tu supervisor.'}
 if(act==='print')window.print();
 if(act==='qa'){const q=a.closest('.q'),k=+q.dataset.q;S.quiz.a=S.quiz.a||[];if(S.quiz.a[k])return;S.quiz.a[k]=a.dataset.v;save();course(CUR.c.id,12);window.scrollTo({top:window.scrollY})}
 if(act==='qreset'){S.quiz.a=[];save();course(CUR.c.id,12)}
});
document.addEventListener('input',e=>{const t=e.target.dataset&&e.target.dataset.txt;if(t){S.txt[t]=e.target.value;save()}});

function modal(html){const m=$('#modal');m.innerHTML='<div class="mbox" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;const f=m.querySelector('input,select');if(f)f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
let REGCB=null;
function openReg(ok,cancel){REGCB=[ok,cancel];modal(`<h2>Antes de comenzar</h2><p class="sub">Registra tus datos para acceder al material. Los dos campos son obligatorios.</p><form id="regf"><label class="f" for="rn" style="margin-top:0">Nombre completo</label><input id="rn" autocomplete="name" placeholder="Nombre y apellidos" required><label class="f" for="rc">Centro</label><select id="rc" required><option value="">Selecciona tu centro…</option>${CENTROS.map(c=>`<option>${c}</option>`).join('')}</select><div class="err" id="rerr" role="alert"></div><div class="acts"><button type="button" class="btn" data-act="regcancel">Cancelar</button><button class="btn primary" type="submit">Registrarme y comenzar</button></div></form>`)}
function topbar(){const u=cu(),box=$('#tbActions');let h='';
 if(u)h+=`<button class="me" data-act="me" title="Mi registro"><i>${esc(u.nombre.trim()[0].toUpperCase())}</i><span>${esc(u.nombre)} · ${esc(u.centro)}</span></button>`;
 if(isAdmin())h+=`<button class="btn" data-go="admin">Panel de administrador</button><button class="btn" data-act="adminout">Salir</button>`;
 else h+=`<button class="btn" data-act="adminlogin">Administrador</button>`;
 box.innerHTML=h}
function instOn(){try{return isAdmin()&&sessionStorage.getItem('csb-inst')==='1'}catch(e){return false}}
function renderTop(){document.body.classList.toggle('inst-on',instOn());topbar()}
function allRows(){const map={};Object.values(DB.imported).forEach(u=>map[u.id]=u);Object.values(DB.users).forEach(u=>{if(!map[u.id]||(u.ult||'')>=(map[u.id].ult||''))map[u.id]=u});
 const rows=[];Object.values(map).forEach(u=>{Object.values(COURSES).forEach(c=>{const d=(u.done&&u.done[c.id])||[],q=quizScore(u);rows.push({fecha:u.fecha,nombre:u.nombre,centro:u.centro,mes:MONTHS[c.month][0],curso:c.title,avance:Math.round(100*d.length/c.lessons.length),lec:d.length+' de '+c.lessons.length,quiz:q===null?'':q,apr:q===null?'':(q>=8?'Sí':'No'),ult:u.ult||''})})});return rows.sort((a,b)=>(a.fecha<b.fecha?1:-1))}
const fd=s=>s?new Date(s).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'';
let AF={centro:'',mes:''};
function admin(){const rows=allRows(),f=rows.filter(r=>(!AF.centro||r.centro===AF.centro)&&(!AF.mes||r.mes===AF.mes));
 const done=rows.filter(r=>r.avance>=100).length;
 app.innerHTML=`<div class="adm"><div class="eyebrow crumb"><button data-go="home">Inicio</button> › Administrador</div><h1>Registros y avance</h1><p class="sub">Datos de las personas registradas en este navegador, más los archivos de avance que importes.</p>
 <div class="grid g4 mt mb"><div class="stat"><b>${new Set(rows.map(r=>r.nombre+r.centro)).size}</b><span>personas registradas</span></div><div class="stat"><b>${done}</b><span>cursos completados</span></div><div class="stat"><b>${new Set(rows.map(r=>r.centro)).size}</b><span>centros con registros</span></div><div class="stat"><b>${rows.filter(r=>r.apr==='Sí').length}</b><span>quiz aprobados</span></div></div>
 <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px"><div><b>Modo instructor</b><p class="sub">Muestra, al final de cada lección, las notas para quien imparte la sesión. Solo tú lo ves y lo controlas desde aquí.</p></div><button class="btn toggle" id="instT" data-act="instt" aria-pressed="${instOn()}">${instOn()?'Activado':'Desactivado'}</button></div>
 <div class="bar2"><select id="fc" aria-label="Filtrar por centro"><option value="">Todos los centros</option>${CENTROS.map(c=>`<option ${AF.centro===c?'selected':''}>${c}</option>`).join('')}</select><select id="fm" aria-label="Filtrar por mes"><option value="">Todos los meses</option>${MONTHS.map(m=>`<option ${AF.mes===m[0]?'selected':''}>${m[0]}</option>`).join('')}</select><span style="flex:1"></span><button class="btn primary" data-act="exp">Exportar a Excel (CSV)</button><button class="btn" data-act="imp">Importar avances</button><button class="btn" data-act="wipe">Borrar datos de este navegador</button><input type="file" id="impf" accept=".json" multiple hidden></div>
 <div class="tbl"><table><thead><tr><th>Registro</th><th>Nombre</th><th>Centro</th><th>Mes</th><th>Curso</th><th>Avance</th><th>Lecciones</th><th>Quiz</th><th>Aprobado</th><th>Última actividad</th></tr></thead><tbody>${f.length?f.map(r=>`<tr><td>${fd(r.fecha)}</td><td>${esc(r.nombre)}</td><td>${esc(r.centro)}</td><td>${r.mes}</td><td>${esc(r.curso)}</td><td>${r.avance}%</td><td>${r.lec}</td><td>${r.quiz===''?'—':r.quiz+'/10'}</td><td>${r.apr||'—'}</td><td>${fd(r.ult)}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">Aún no hay registros.</td></tr>'}</tbody></table></div>
 <p class="sub mt">Los registros se guardan en el navegador de cada persona. Para reunirlos aquí, pide a cada una su archivo con «Descargar mi avance» e impórtalos, o conecta un destino en línea para recibirlos automáticamente.</p></div>`;
 $('#fc').onchange=e=>{AF.centro=e.target.value;admin()};$('#fm').onchange=e=>{AF.mes=e.target.value;admin()};
 $('#impf').onchange=async e=>{let n=0;for(const fl of e.target.files){try{const o=JSON.parse(await fl.text());(Array.isArray(o)?o:[o]).forEach(u=>{if(u&&u.id&&u.nombre){DB.imported[u.id]=u;n++}})}catch(x){}}save();alert(n+' registro(s) importado(s).');admin()}}
function csv(){const rows=allRows(),H=['Registro','Nombre completo','Centro','Mes','Curso','Avance %','Lecciones','Quiz (de 10)','Aprobado','Ultima actividad'];
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return '﻿'+[H].concat(rows.map(r=>[fd(r.fecha),r.nombre,r.centro,r.mes,r.curso,r.avance,r.lec,r.quiz,r.apr,fd(r.ult)])).map(r=>r.map(q).join(',')).join('\r\n')}
function dlFile(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}
document.addEventListener('submit',e=>{
 if(e.target.id==='regf'){e.preventDefault();const n=$('#rn').value.trim().replace(/\s+/g,' '),c=$('#rc').value,er=$('#rerr');
  if(n.split(' ').filter(x=>x.length>1).length<2){er.textContent='Escribe tu nombre completo (nombre y apellido).';return}
  if(!c){er.textContent='Selecciona tu centro.';return}
  const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);DB.users[id]={id,nombre:n,centro:c,fecha:new Date().toISOString(),done:{},txt:{},match:{},quiz:{}};DB.cur=id;save();closeModal();const cb=REGCB&&REGCB[0];REGCB=null;renderTop();if(cb)cb()}
 if(e.target.id==='admf'){e.preventDefault();if(hsh($('#ap').value)===ADMIN_HASH){try{sessionStorage.setItem('csb-admin','1')}catch(x){}closeModal();renderTop();location.hash='admin';route()}else $('#aerr').textContent='Clave incorrecta.'}
});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='regcancel'){closeModal();const cb=REGCB&&REGCB[1];REGCB=null;if(cb)cb()}
 if(act==='adminlogin')modal('<h2>Acceso de administrador</h2><p class="sub">Ingresa la clave para ver los registros y las notas de instructor.</p><form id="admf"><input id="ap" type="password" autocomplete="current-password" placeholder="Clave" required><div class="err" id="aerr" role="alert"></div><div class="acts"><button type="button" class="btn" data-act="mclose">Cancelar</button><button class="btn primary" type="submit">Entrar</button></div></form>');
 if(act==='mclose')closeModal();
 if(act==='adminout'){try{sessionStorage.removeItem('csb-admin');sessionStorage.removeItem('csb-inst')}catch(x){}document.body.classList.remove('inst-on');['done','txt','match','quiz'].forEach(k=>TMP[k]={});location.hash='home';route()}
 if(act==='instt'){const on=!instOn();try{sessionStorage.setItem('csb-inst',on?'1':'0')}catch(x){}document.body.classList.toggle('inst-on',on);a.setAttribute('aria-pressed',String(on));a.textContent=on?'Activado':'Desactivado'}
 if(act==='me'){const u=cu();modal(`<h2>Mi registro</h2><p class="sub"><b>${esc(u.nombre)}</b><br>${esc(u.centro)} · registrado el ${fd(u.fecha)}</p><div class="acts" style="justify-content:flex-start"><button class="btn" data-act="dl">Descargar mi avance</button><button class="btn" data-act="switch">Cambiar de persona</button><button class="btn primary" data-act="mclose">Cerrar</button></div>`)}
 if(act==='dl'){const u=cu();if(u)dlFile('avance_'+u.nombre.replace(/\s+/g,'_')+'.json',JSON.stringify({id:u.id,nombre:u.nombre,centro:u.centro,fecha:u.fecha,ult:u.ult,done:u.done,quiz:u.quiz}),'application/json')}
 if(act==='switch'){DB.cur=null;save();closeModal();location.hash='home';route()}
 if(act==='exp')dlFile('registros_capacitacion_2027.csv',csv(),'text/csv;charset=utf-8');
 if(act==='imp')$('#impf').click();
 if(act==='wipe'&&confirm('Se borrarán los registros guardados en este navegador. ¿Continuar?')){DB={users:{},imported:{},cur:null};save();admin();renderTop()}
});
route();
})();
</script></body></html>
